model: weights/yolo11m.pt
data: configs/waterscenes_full.yaml
imgsz: 640
epochs: 200
batch: 16
optimizer: AdamW
lr0: 0.001
lrf: 0.01
weight_decay: 0.0005
momentum: 0.937
warmup_epochs: 3
